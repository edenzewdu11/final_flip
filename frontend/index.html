<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="./static/images/Flip_Star_Final_Logo_v3_side__2_-removebg-preview.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FlipStar - Modern social media platform for sharing videos and images"
    />
    <title>FlipStar</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        border: none;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
    <script>
      console.log('[FlipStar] HTML head loaded');
    </script>

    <!-- Open Graph / Facebook / WhatsApp / iMessage -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FlipStar" />
    <meta property="og:title" content="FlipStar — Check this out" />
    <meta
      property="og:description"
      content="Watch and share videos on FlipStar"
    />
    <meta
      property="og:image"
      content="./static/images/Flip_Star_Final_Logo_v3_side__2_-removebg-preview.png"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FlipStar — Check this out" />
    <meta
      name="twitter:description"
      content="Watch and share videos on FlipStar"
    />
    <meta
      name="twitter:image"
      content="./static/images/Flip_Star_Final_Logo_v3_side__2_-removebg-preview.png"
    />

    <!-- VConsole for mobile debugging - loaded conditionally in main.jsx to avoid CSP violations -->
    <script type="module" src="/main.jsx"></script>
  </head>
  <body>
    <!-- Skeleton sits outside #root so React replacement never shifts layout -->
    <div
      id="app-skeleton"
      style="
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        background: #f5f5f5;
        z-index: 9999;
        pointer-events: none;
      "
    >
      <div
        style="
          flex: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          position: relative;
        "
      >
        <div
          style="
            width: 100%;
            max-width: 420px;
            height: 100%;
            background: #fff;
            position: relative;
            overflow: hidden;
          "
        >
          <div
            style="
              position: absolute;
              top: 0;
              left: 0;
              right: 0;
              bottom: 0;
              background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(0, 0, 0, 0.03) 50%,
                transparent 100%
              );
              animation: shimmer 1.5s infinite;
            "
          ></div>
          <div
            style="position: absolute; bottom: 80px; left: 16px; right: 70px"
          >
            <div
              style="
                width: 120px;
                height: 14px;
                background: rgba(0, 0, 0, 0.08);
                border-radius: 7px;
                margin-bottom: 10px;
              "
            ></div>
            <div
              style="
                width: 200px;
                height: 12px;
                background: rgba(0, 0, 0, 0.05);
                border-radius: 6px;
                margin-bottom: 6px;
              "
            ></div>
            <div
              style="
                width: 160px;
                height: 12px;
                background: rgba(0, 0, 0, 0.03);
                border-radius: 6px;
              "
            ></div>
          </div>
          <div
            style="
              position: absolute;
              bottom: 80px;
              right: 12px;
              display: flex;
              flex-direction: column;
              gap: 20px;
              align-items: center;
            "
          >
            <div
              style="
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: rgba(0, 0, 0, 0.08);
              "
            ></div>
            <div
              style="
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: rgba(0, 0, 0, 0.08);
              "
            ></div>
            <div
              style="
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: rgba(0, 0, 0, 0.08);
              "
            ></div>
          </div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      console.log(
        '[FlipStar] Body loaded, root element exists:',
        !!document.getElementById('root'),
      );
      // Fail-safe: remove skeleton after 2.5 seconds if React doesn't load
      setTimeout(function () {
        var skeleton = document.getElementById('app-skeleton');
        if (skeleton) {
          skeleton.style.transition = 'opacity 0.3s ease';
          skeleton.style.opacity = '0';
          setTimeout(function () {
            skeleton.remove();
          }, 300);
        }
      }, 2500);
    </script>
  </body>
</html>

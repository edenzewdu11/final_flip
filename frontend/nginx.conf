events { worker_connections 1024; }


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name uat.flipstar.et;
        return 301 https://$host$request_uri;
    }

    # Telebirr Callback Server (uat.flipstar.et:6082 - HTTP for Telebirr)
    server {
        listen 6082;
        server_name uat.flipstar.et;

        # Django Backend (API only for callbacks)
        location /api/ {
            client_max_body_size 100M;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
            send_timeout 300;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        server_name uat.flipstar.et;

        ssl_certificate     /etc/letsencrypt/live/uat.flipstar.et/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/uat.flipstar.et/privkey.pem;

        # Standard SSL Security
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Static and Media files
        location /static/ {
            alias /app/staticfiles/;
        }

        location /media/ {
            alias /app/media/;
        }

        # Ethiotelecom S3 media proxy (serves over HTTPS to avoid mixed content)
        location /flipstar-media/ {
            proxy_pass http://flipstar.obsv3.et-global-3.ethiotelecom.et/flipstar-media/;
            proxy_set_header Host flipstar.obsv3.et-global-3.ethiotelecom.et;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
        }

        # Logo file
        location /assets/green-logo.png {
            alias /usr/share/nginx/html/assets/green-logo.png;
        }

        # Django Backend
        location /api/ {
            client_max_body_size 100M;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
            send_timeout 300;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # React Frontend
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
